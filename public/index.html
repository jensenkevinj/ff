<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Tints the phone browser's toolbar to match the page background in each theme. -->
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)" />
    <title>FF Live</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>FF Live</h1>
      <div class="freshness">
        <span id="last-updated" class="muted">Loading…</span>
        <button id="refresh" type="button" aria-label="Refresh now" title="Refresh now">↻</button>
      </div>
    </header>
    <nav id="tabs" role="tablist" aria-label="Leagues" hidden></nav>
    <main id="matchups" role="tabpanel" aria-busy="true">
      <!-- Placeholder in the card's shape until the first response; render() replaces it. -->
      <div class="card skeleton" aria-hidden="true">
        <div class="bone short"></div>
        <div class="skeleton-body">
          <div class="bone tall"></div>
          <div class="bone tall"></div>
        </div>
        <div class="bone"></div>
        <div class="bone"></div>
        <div class="bone"></div>
        <div class="bone"></div>
      </div>
    </main>
    <script src="app.js" type="module"></script>
  </body>
</html>
